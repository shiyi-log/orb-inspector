name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js 测试
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orb-inspector/package-lock.json
      - name: 安装依赖
        working-directory: orb-inspector
        run: npm ci
      - name: 运行测试
        working-directory: orb-inspector
        run: npm test
